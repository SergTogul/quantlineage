<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>RiskForge Runtime</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#0d1117;color:#e6edf3}.wrap{max-width:1200px;margin:auto;padding:24px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,table{background:#161b22;border:1px solid #30363d;border-radius:8px}.card{padding:16px}.k{font-size:12px;color:#8b949e}.v{font-size:24px;font-weight:700;margin-top:6px}table{width:100%;border-collapse:collapse;margin-top:18px;overflow:hidden}th,td{padding:10px 12px;border-bottom:1px solid #30363d;text-align:left}th{color:#8b949e;font-size:12px}.SEVERE{color:#ff7b72;font-weight:700}.HIGH{color:#d29922;font-weight:700}.MODERATE{color:#a5d6ff}.LOW{color:#7ee787}.breach{color:#ff7b72}.ok{color:#7ee787}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><div class='wrap'><h1>RiskForge</h1><p>Portfolio & Derivatives Risk — Stress Threat Evaluation</p><div class='cards' id='cards'></div><table><thead><tr><th>Scenario</th><th>Kind</th><th>P&L</th><th>Loss % NAV</th><th>Threat</th><th>Limit</th></tr></thead><tbody id='rows'></tbody></table><pre id='err'></pre></div><script>
const money=x=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(x);
const pct=x=>(x*100).toFixed(1)+'%';
async function main(){try{const p=await fetch('http://127.0.0.1:8000/portfolio').then(r=>r.json());const r=await fetch('http://127.0.0.1:8000/risk/stress/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}).then(r=>r.json());document.getElementById('cards').innerHTML=`<div class=card><div class=k>Base MV</div><div class=v>${money(r.base_market_value)}</div></div><div class=card><div class=k>Worst scenario</div><div class=v>${r.worst_scenario}</div></div><div class=card><div class=k>Worst loss</div><div class=v>${money(r.worst_loss)}</div></div><div class=card><div class=k>Breaches</div><div class=v>${r.breach_count}</div></div>`;document.getElementById('rows').innerHTML=r.evaluations.map(x=>`<tr><td>${x.scenario}</td><td>${x.kind}</td><td>${money(x.pnl)}</td><td>${pct(x.loss_pct_nav)}</td><td class=${x.threat_level}>${x.threat_level}</td><td class=${x.breached?'breach':'ok'}>${x.breached?'BREACH':'OK'} (${pct(x.max_loss_pct)})</td></tr>`).join('')}catch(e){document.getElementById('err').textContent=String(e)}} main();
</script></body></html>
