# RiskForge CI — honest gates matching README / BUILD_NOTES commands.
#
# Jobs: backend-pytest, backend-quantlib-hard-gate (R0.1.6), PR-FAST (R0.12.1),
# PR-FULL (R0.12.2), postgres-smoke, frontend-test-build, lint (M9.7),
# e2e-playwright (M9.2 / M9.10).
# R0.12.1: a green "PR-FAST" means deterministic goldens + frontend unit/lint ran (not PR-FULL).
# R0.12.2: a green "PR-FULL" means the production-relevant jobs below all succeeded.
# R0.12.4 nightly heavier checks live in .github/workflows/nightly.yml
# (schedule + workflow_dispatch only). Do not add those jobs to PR-FULL needs.
# QuantLib E2E (quantlib-e2e) and hierarchy-benchmark are nightly-only;
# PR e2e stays builtin. Do not add those jobs to PR-FULL needs.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend-pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer full QuantLib wheel on Ubuntu (in requirements.txt).
          # If that install fails, continue without QuantLib so non-QL tests still run.
          if pip install -r requirements.txt; then
            echo "Installed backend/requirements.txt (including QuantLib if resolvable)."
          else
            echo "::warning::Full requirements install failed; retrying without QuantLib"
            grep -Eiv '^[[:space:]]*QuantLib' requirements.txt > /tmp/requirements-no-ql.txt
            pip install -r /tmp/requirements-no-ql.txt
          fi

      - name: Detect pricing engine
        id: pricing
        run: |
          if python -c "import QuantLib as ql; print(ql.__version__)"; then
            echo "engine=quantlib" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::QuantLib import failed; using builtin (QL adapter tests will skip via importorskip)"
            echo "engine=builtin" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pytest
        env:
          PYTHONPATH: .
          RISKFORGE_PRICING_ENGINE: ${{ steps.pricing.outputs.engine }}
        run: pytest -q

      # Explicit native compile check (g++ is present on ubuntu-latest).
      # Flags and TUs match test_native_kernel.py / README / test_native_ci.py
      # (kernel_test.cpp + risk_kernel_capi.cpp; -I include for the test binary).
      - name: Native C++ compile and smoke
        run: |
          if ! command -v g++ >/dev/null 2>&1; then
            echo "::warning::g++ unavailable; skipping native compile check"
            exit 0
          fi
          g++ -std=c++20 -O2 -pthread -I native/include \
            native/tests/kernel_test.cpp native/src/risk_kernel_capi.cpp \
            -o /tmp/kernel_test
          /tmp/kernel_test | tee /tmp/kernel_test.out
          grep -q risk_kernel_ok /tmp/kernel_test.out
          # Shared lib needs -I include (header holds jthread pool; M6.4).
          g++ -std=c++20 -O3 -shared -fPIC -pthread -I native/include \
            native/src/risk_kernel_capi.cpp -o /tmp/libriskkernel.so
          test -f /tmp/libriskkernel.so

  # R0.1.6 / RF-016: QuantLib is mandatory. Missing install or skipped goldens fail.
  backend-quantlib:
    name: backend-quantlib-hard-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies (QuantLib required)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: QuantLib import is mandatory
        run: python -c "import QuantLib as ql; print('QuantLib', ql.__version__)"

      - name: QuantLib goldens and adapter tests (skips fail)
        env:
          PYTHONPATH: .
          RISKFORGE_PRICING_ENGINE: quantlib
          RISKFORGE_REQUIRE_QUANTLIB: "1"
        run: |
          pytest -q \
            tests/test_quantlib_golden.py \
            tests/test_quantlib_pricing.py \
            tests/test_quantlib_process_state.py \
            tests/test_curve_pricing.py \
            tests/test_var_es_golden.py \
            tests/test_approx_pnl_units_golden.py \
            tests/test_full_reval_golden.py \
            tests/test_quantlib_gate.py

  # R0.12.1 / RF-016: deterministic goldens + high-value properties + frontend
  # unit/lint. Builtin pricing is OK. This job is not PR-FULL (QuantLib, native,
  # Playwright, and Postgres remain other jobs; do not treat a green PR-FAST as
  # those having run).
  pr-fast:
    name: PR-FAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # Builtin engine is sufficient for PR-FAST goldens/properties.
          if pip install -r requirements.txt; then
            echo "Installed backend/requirements.txt (including QuantLib if resolvable)."
          else
            echo "::warning::Full requirements install failed; retrying without QuantLib"
            grep -Eiv '^[[:space:]]*QuantLib' requirements.txt > /tmp/requirements-no-ql.txt
            pip install -r /tmp/requirements-no-ql.txt
          fi

      - name: Deterministic goldens and properties (builtin)
        working-directory: backend
        env:
          PYTHONPATH: .
          RISKFORGE_PRICING_ENGINE: builtin
        run: |
          pytest -q \
            tests/test_var_es_golden.py \
            tests/test_approx_pnl_units_golden.py \
            tests/test_full_reval_golden.py \
            tests/test_pricing.py \
            tests/test_quant_properties.py \
            tests/test_m9_risk_properties.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

  # M5.1 / M5.6 / M9.9: prove psycopg path beyond SQLite unit tests.
  postgres-smoke:
    name: postgres-persistence-smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: riskforge
          POSTGRES_PASSWORD: riskforge
          POSTGRES_DB: riskforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskforge -d riskforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies (no QuantLib required)
        run: |
          python -m pip install --upgrade pip
          # Smoke only needs persistence stack (sqlalchemy/alembic/psycopg);
          # skip QuantLib if the wheel fails so Postgres proof still runs.
          if ! pip install -r requirements.txt; then
            echo "::warning::Full requirements install failed; retrying without QuantLib"
            grep -Eiv '^[[:space:]]*QuantLib' requirements.txt > /tmp/requirements-no-ql.txt
            pip install -r /tmp/requirements-no-ql.txt
          fi
          python -c "import sqlalchemy, alembic, psycopg; print('sqlalchemy', sqlalchemy.__version__); print('alembic', alembic.__version__); print('psycopg', psycopg.__version__)"

      - name: Postgres Alembic + seed smoke
        env:
          PYTHONPATH: .
          # Job runs on the GHA VM (not a job container): service port map → localhost.
          RISKFORGE_DATABASE_URL: postgresql+psycopg://riskforge:riskforge@localhost:5432/riskforge
        run: |
          chmod +x ../scripts/smoke_postgres.sh
          # Script: wait-for-pg → alembic upgrade head (backend/migrations/) → seed wiring.
          ../scripts/smoke_postgres.sh

  frontend:
    name: frontend-test-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  # M9.7: Ruff + mypy (backend) and ESLint (frontend). Staged rule sets — see
  # backend/pyproject.toml and frontend/eslint.config.js; ROADMAP documents debt.
  lint:
    name: lint-static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend lint tools
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ruff --version
          mypy --version

      - name: Ruff (backend)
        working-directory: backend
        run: ruff check app tests

      - name: mypy (backend)
        working-directory: backend
        run: mypy app

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint (frontend)
        working-directory: frontend
        run: npm run lint

  # M9.2 / M9.10: Playwright critical-path E2E on GHA (builtin pricing + Vite).
  # Specs live under e2e/; config prefers Playwright Chromium when CI=true.
  e2e:
    name: e2e-playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # E2E uses RISKFORGE_PRICING_ENGINE=builtin; QuantLib optional.
          if pip install -r requirements.txt; then
            echo "Installed backend/requirements.txt"
          else
            echo "::warning::Full requirements install failed; retrying without QuantLib"
            grep -Eiv '^[[:space:]]*QuantLib' requirements.txt > /tmp/requirements-no-ql.txt
            pip install -r /tmp/requirements-no-ql.txt
          fi
          python -c "import uvicorn; print('uvicorn', uvicorn.__version__)"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies and Chromium
        working-directory: e2e
        run: |
          npm ci
          npm run install:browsers:ci

      - name: Run Playwright E2E
        working-directory: e2e
        env:
          CI: true
        run: npm test

  # R0.12.2 / RF-016: single required check whose display name contains PR-FULL.
  # Green only when the production-relevant jobs have all succeeded. This job
  # does not re-run pytest. It does not skip when QuantLib is missing — the
  # hard-gate (backend-quantlib) remains mandatory. Not nightly (R0.12.4) or ABI (R0.12.5).
  pr-full:
    name: PR-FULL
    needs:
      - backend
      - backend-quantlib
      - frontend
      - lint
      - e2e
      - postgres-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Production-relevant jobs succeeded
        run: |
          echo "PR-FULL: backend, backend-quantlib, frontend, lint, e2e, postgres-smoke succeeded"
