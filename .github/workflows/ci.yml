# RiskForge CI — honest gates matching README / BUILD_NOTES commands.
#
# M9.9 status: workflow + scripts/smoke_postgres.sh are authored and locally
# proven against Compose Postgres. GitHub-hosted runner green evidence is
# still required before marking M9.9 / M5.1 COMPLETE (needs origin remote + push).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend-pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer full QuantLib wheel on Ubuntu (in requirements.txt).
          # If that install fails, continue without QuantLib so non-QL tests still run.
          if pip install -r requirements.txt; then
            echo "Installed backend/requirements.txt (including QuantLib if resolvable)."
          else
            echo "::warning::Full requirements install failed; retrying without QuantLib"
            grep -Eiv '^[[:space:]]*QuantLib' requirements.txt > /tmp/requirements-no-ql.txt
            pip install -r /tmp/requirements-no-ql.txt
          fi

      - name: Detect pricing engine
        id: pricing
        run: |
          if python -c "import QuantLib as ql; print(ql.__version__)"; then
            echo "engine=quantlib" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::QuantLib import failed; using builtin (QL adapter tests will skip via importorskip)"
            echo "engine=builtin" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pytest
        env:
          PYTHONPATH: .
          RISKFORGE_PRICING_ENGINE: ${{ steps.pricing.outputs.engine }}
        run: pytest -q

      # Explicit native compile check (g++ is present on ubuntu-latest).
      # Flags match test_native_kernel.py / README (-I include for the test binary).
      - name: Native C++ compile and smoke
        run: |
          if ! command -v g++ >/dev/null 2>&1; then
            echo "::warning::g++ unavailable; skipping native compile check"
            exit 0
          fi
          g++ -std=c++20 -O2 -pthread -I native/include \
            native/tests/kernel_test.cpp -o /tmp/kernel_test
          /tmp/kernel_test | tee /tmp/kernel_test.out
          grep -q risk_kernel_ok /tmp/kernel_test.out
          # Shared lib needs -I include (header holds jthread pool; M6.4).
          g++ -std=c++20 -O3 -shared -fPIC -pthread -I native/include \
            native/src/risk_kernel_capi.cpp -o /tmp/libriskkernel.so
          test -f /tmp/libriskkernel.so

  # M5.1 / M5.6 / M9.9: prove psycopg path beyond SQLite unit tests.
  postgres-smoke:
    name: postgres-persistence-smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: riskforge
          POSTGRES_PASSWORD: riskforge
          POSTGRES_DB: riskforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riskforge -d riskforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies (no QuantLib required)
        run: |
          python -m pip install --upgrade pip
          # Smoke only needs persistence stack (sqlalchemy/alembic/psycopg);
          # skip QuantLib if the wheel fails so Postgres proof still runs.
          if ! pip install -r requirements.txt; then
            echo "::warning::Full requirements install failed; retrying without QuantLib"
            grep -Eiv '^[[:space:]]*QuantLib' requirements.txt > /tmp/requirements-no-ql.txt
            pip install -r /tmp/requirements-no-ql.txt
          fi
          python -c "import sqlalchemy, alembic, psycopg; print('sqlalchemy', sqlalchemy.__version__); print('alembic', alembic.__version__); print('psycopg', psycopg.__version__)"

      - name: Postgres Alembic + seed smoke
        env:
          PYTHONPATH: .
          # Job runs on the GHA VM (not a job container): service port map → localhost.
          RISKFORGE_DATABASE_URL: postgresql+psycopg://riskforge:riskforge@localhost:5432/riskforge
        run: |
          chmod +x ../scripts/smoke_postgres.sh
          # Script: wait-for-pg → alembic upgrade head (backend/migrations/) → seed wiring.
          ../scripts/smoke_postgres.sh

  frontend:
    name: frontend-test-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
