# Local AI settings: cp .env.example .env (optional; default provider is deterministic).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantlineage
      POSTGRES_PASSWORD: quantlineage
      POSTGRES_DB: quantlineage
    # Local demo: bind to loopback so a laptop on a shared network does not expose Postgres.
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - quantlineage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlineage -d quantlineage"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Apply schema before API/worker: docker compose run --rm backend alembic upgrade head
  backend:
    build: ./backend
    environment:
      QUANTLINEAGE_PRICING_ENGINE: quantlib
      # SQLAlchemy URL (psycopg3). Host ``postgres`` is the Compose service name.
      QUANTLINEAGE_DATABASE_URL: postgresql+psycopg://quantlineage:quantlineage@postgres:5432/quantlineage
      # Defer execution to the ``worker`` service (shared Postgres QUEUED rows).
      QUANTLINEAGE_EXTERNAL_WORKER: "1"
      # OpenAI risk assistant — backend only; values from project-root ``.env``.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QUANTLINEAGE_AI_PROVIDER: ${QUANTLINEAGE_AI_PROVIDER:-deterministic}
      QUANTLINEAGE_OPENAI_MODEL: ${QUANTLINEAGE_OPENAI_MODEL:-}
      QUANTLINEAGE_AI_TIMEOUT_SECONDS: ${QUANTLINEAGE_AI_TIMEOUT_SECONDS:-30}
      QUANTLINEAGE_AI_MAX_OUTPUT_TOKENS: ${QUANTLINEAGE_AI_MAX_OUTPUT_TOKENS:-512}
      QUANTLINEAGE_AI_MAX_TOOL_ROUNDS: ${QUANTLINEAGE_AI_MAX_TOOL_ROUNDS:-1}
    # Local demo: bind to loopback (unauthenticated API; not internet-ready).
    # Shared/non-loopback: set QUANTLINEAGE_SHARED_DEPLOYMENT=1 and QUANTLINEAGE_API_TOKEN (R0.11.5).
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  # Same image / RiskRunWorker as API lifespan; claims QUEUED via FOR UPDATE SKIP LOCKED (M5.7).
  # Distinct OS process from ``backend`` (R0.3.5 QuantLib process partition). Extra replicas
  # are claim-safe on Postgres (no Redis/RQ); do not run QuantLib in the API process.
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      QUANTLINEAGE_PRICING_ENGINE: quantlib
      QUANTLINEAGE_DATABASE_URL: postgresql+psycopg://quantlineage:quantlineage@postgres:5432/quantlineage
      QUANTLINEAGE_WORKER_POLL_INTERVAL: "2"
      QUANTLINEAGE_WORKER_POLL_BATCH: "10"
      # Same backend image; keep AI env aligned with ``backend`` (query runs in API).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QUANTLINEAGE_AI_PROVIDER: ${QUANTLINEAGE_AI_PROVIDER:-deterministic}
      QUANTLINEAGE_OPENAI_MODEL: ${QUANTLINEAGE_OPENAI_MODEL:-}
      QUANTLINEAGE_AI_TIMEOUT_SECONDS: ${QUANTLINEAGE_AI_TIMEOUT_SECONDS:-30}
      QUANTLINEAGE_AI_MAX_OUTPUT_TOKENS: ${QUANTLINEAGE_AI_MAX_OUTPUT_TOKENS:-512}
      QUANTLINEAGE_AI_MAX_TOOL_ROUNDS: ${QUANTLINEAGE_AI_MAX_TOOL_ROUNDS:-1}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    # Local demo: bind to loopback (static frontend; not internet-ready).
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]

volumes:
  quantlineage_pgdata:
