services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: riskforge
      POSTGRES_PASSWORD: riskforge
      POSTGRES_DB: riskforge
    # Local demo: bind to loopback so a laptop on a shared network does not expose Postgres.
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - riskforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskforge -d riskforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Apply schema before API/worker: docker compose run --rm backend alembic upgrade head
  backend:
    build: ./backend
    environment:
      RISKFORGE_PRICING_ENGINE: quantlib
      # SQLAlchemy URL (psycopg3). Host ``postgres`` is the Compose service name.
      RISKFORGE_DATABASE_URL: postgresql+psycopg://riskforge:riskforge@postgres:5432/riskforge
      # Defer execution to the ``worker`` service (shared Postgres QUEUED rows).
      RISKFORGE_EXTERNAL_WORKER: "1"
    # Local demo: bind to loopback (unauthenticated API; not internet-ready).
    # Shared/non-loopback: set RISKFORGE_SHARED_DEPLOYMENT=1 and RISKFORGE_API_TOKEN (R0.11.5).
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  # Same image / RiskRunWorker as API lifespan; claims QUEUED via FOR UPDATE SKIP LOCKED (M5.7).
  # Distinct OS process from ``backend`` (R0.3.5 QuantLib process partition). Extra replicas
  # are claim-safe on Postgres (no Redis/RQ); do not run QuantLib in the API process.
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      RISKFORGE_PRICING_ENGINE: quantlib
      RISKFORGE_DATABASE_URL: postgresql+psycopg://riskforge:riskforge@postgres:5432/riskforge
      RISKFORGE_WORKER_POLL_INTERVAL: "2"
      RISKFORGE_WORKER_POLL_BATCH: "10"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    # Local demo: bind to loopback (static frontend; not internet-ready).
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]

volumes:
  riskforge_pgdata:
