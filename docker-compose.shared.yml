# Shared / internal profile (RF-014). Not production IAM / OIDC.
#
# Usage:
#   cp .env.shared.example .env.shared   # fill POSTGRES_PASSWORD and tokens
#   docker compose --env-file .env.shared -f docker-compose.shared.yml up --build
#
# TLS terminator (Caddy) is the only host publish (443). Backend stays on the
# compose network (loopback/internal). Local docker-compose.yml is unchanged.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantlineage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: quantlineage
    volumes:
      - quantlineage_shared_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantlineage -d quantlineage"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      QUANTLINEAGE_PRICING_ENGINE: quantlib
      QUANTLINEAGE_DATABASE_URL: postgresql+psycopg://quantlineage:${POSTGRES_PASSWORD:?}@postgres:5432/quantlineage
      QUANTLINEAGE_EXTERNAL_WORKER: "1"
      QUANTLINEAGE_SHARED_DEPLOYMENT: "1"
      # TOKEN is optional when TOKENS is set; boot fails closed if both empty.
      QUANTLINEAGE_API_TOKEN: ${QUANTLINEAGE_API_TOKEN:-}
      QUANTLINEAGE_API_TOKENS: ${QUANTLINEAGE_API_TOKENS:-}
      # OpenAI risk assistant — backend/worker only. Set OPENAI_API_KEY via platform
      # secret store (or .env.shared for this profile); never pass to frontend build.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-512}
      AI_MAX_TOOL_ROUNDS: ${AI_MAX_TOOL_ROUNDS:-1}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      QUANTLINEAGE_PRICING_ENGINE: quantlib
      QUANTLINEAGE_DATABASE_URL: postgresql+psycopg://quantlineage:${POSTGRES_PASSWORD:?}@postgres:5432/quantlineage
      QUANTLINEAGE_WORKER_POLL_INTERVAL: "2"
      QUANTLINEAGE_WORKER_POLL_BATCH: "10"
      QUANTLINEAGE_SHARED_DEPLOYMENT: "1"
      QUANTLINEAGE_API_TOKEN: ${QUANTLINEAGE_API_TOKEN:-}
      QUANTLINEAGE_API_TOKENS: ${QUANTLINEAGE_API_TOKENS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-512}
      AI_MAX_TOOL_ROUNDS: ${AI_MAX_TOOL_ROUNDS:-1}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: same-origin
    expose:
      - "80"
    depends_on: [backend]

  proxy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

volumes:
  quantlineage_shared_pgdata:
