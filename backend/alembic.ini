# Alembic config for QuantLineage persistence (M5.1).
# Run from backend/:  alembic upgrade head
# DATABASE URL: QUANTLINEAGE_DATABASE_URL or sqlalchemy.url below (SQLite for offline).

[alembic]
script_location = migrations
path_separator = os
prepend_sys_path = .
version_path_separator = os

# Overridden by env.py from QUANTLINEAGE_DATABASE_URL when set.
sqlalchemy.url = sqlite:///./quantlineage_dev.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
